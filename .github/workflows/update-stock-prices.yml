name: Update Stock Prices

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Notion stock prices
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_READER_TOKEN: ${{ secrets.NOTION_READER_TOKEN }}
        shell: bash
        run: |
          echo "=========================================="
          echo "Attempt 1/2"
          echo "=========================================="

          if python stock_price_updater.py; then
            echo ""
            echo "Stock price update succeeded on attempt 1."
            exit 0
          fi

          echo ""
          echo "Attempt 1 failed."
          echo "Waiting 30 seconds before retrying..."
          sleep 30

          echo ""
          echo "=========================================="
          echo "Attempt 2/2"
          echo "=========================================="

          if python stock_price_updater.py; then
            echo ""
            echo "Stock price update succeeded on attempt 2."
            exit 0
          fi

          echo ""
          echo "::error::Stock price updater failed twice consecutively."
          exit 1
