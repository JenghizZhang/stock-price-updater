name: Keep Repository Active

on:
  workflow_dispatch:
  schedule:
    # Run once a month, well before GitHub's 60-day inactivity window.
    - cron: "17 12 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          printf "Last keepalive: %s\n" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt

      - name: Commit keepalive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt

          if git diff --cached --quiet; then
            echo "No keepalive change to commit."
            exit 0
          fi

          git commit -m "chore: keep scheduled workflows active"
          git push
